version: '3.8'

services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - TORCH_CUDA_ARCH_LIST=8.0;8.6;8.9;9.0;10.0
        - MAX_JOBS=4
    
    image: comfyui-runpod-s3:latest
    
    container_name: comfyui-production
    
    # GPU support (Compose)
    gpus: all
    
    # Port mapping
    ports:
      - "8188:8188"
    
    # Environment variables
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - PYTHONUNBUFFERED=1
      - RUN_MODE=ui
      - QWEN_REPO_ID=Qwen/Qwen-Image
      - QWEN_FILENAME=qwen_image_distill_full_bf16.safetensors
    
    # Volume mounts for persistence
    volumes:
      - ./models:/workspace/ComfyUI/models
      - ./input:/workspace/ComfyUI/input
      - ./output:/workspace/ComfyUI/output
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    
    # Restart policy
    restart: unless-stopped
    
    # Resource limits (adjust for RunPod)
    mem_limit: 16g
    memswap_limit: 16g
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"